services:
  - type: web
    name: medassist-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: RERANK_MODEL
        value: cross-encoder/ms-marco-TinyBERT-L-2-v2
    disk:
      name: chroma-data
      mountPath: /app/chroma_db
      sizeGB: 1
